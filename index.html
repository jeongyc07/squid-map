<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦑 무늬오징어 포인트 맵</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        #map { width: 100%; height: 100%; }
    </style>
    <!-- 카카오 지도 SDK -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9f9339f1c455ac084a23d987ceb30e56"></script>
</head>
<body>

    <!-- 지도 영역 -->
    <div id="map"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof kakao === 'undefined' || !kakao.maps) {
                alert("카카오 지도 SDK 로드 실패!");
                return;
            }

            const mapContainer = document.getElementById('map');
            const mapOption = { 
                center: new kakao.maps.LatLng(33.38, 126.55), // 초기 중심 좌표 (제주도)
                level: 9, 
                mapTypeId: kakao.maps.MapTypeId.SKYVIEW // 위성 지도 설정
            };

            const map = new kakao.maps.Map(mapContainer, mapOption);

            // 지도 타입 컨트롤(일반/스카이뷰 전환 버튼) 추가
            const mapTypeControl = new kakao.maps.MapTypeControl();
            map.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPLEFT);

            // 줌 컨트롤 추가
            const zoomControl = new kakao.maps.ZoomControl();
            map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);
        });
    </script>
</body>
</html>
