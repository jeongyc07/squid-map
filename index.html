<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무늬오징어 포인트 맵</title>
    <link rel="shortcut icon" href="#">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; font-family: 'Apple SD Gothic Neo', sans-serif; }
        .main-container { display: flex; width: 100vw; height: 100vh; }
        
        #map { width: 67%; height: 100%; }
        
        #info-panel { 
            width: 33%; height: 100%; padding: 20px; 
            background: #ffffff; border-left: 1px solid #e0e0e0; overflow-y: auto;
        }

        h2 { font-size: 20px; color: #1a252f; margin-bottom: 4px; }
        .sub-text { color: #7f8c8d; font-size: 13px; margin-bottom: 15px; }
        
        .card { 
            background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; 
            padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .card h3 { font-size: 15px; color: #2c3e50; margin-bottom: 10px; border-bottom: 2px solid #3498db; padding-bottom: 5px; display: inline-block; }
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 14px; }
        
        .wind-arrow { display: inline-block; font-size: 24px; font-weight: bold; color: #e74c3c; transition: transform 0.3s ease; }
        .weather-badge { font-weight: bold; color: #2980b9; }

        .obs-name { font-size: 13px; color: #16a085; font-weight: bold; margin-bottom: 10px; }
        .tide-list { list-style: none; margin-top: 8px; }
        .tide-item { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #e0e0e0; }
        .tide-high { color: #e74c3c; font-weight: bold; }
        .tide-low { color: #2980b9; font-weight: bold; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            #map { width: 100%; height: 50vh; }
            #info-panel { width: 100%; height: 50vh; }
        }
    </style>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9f9339f1c455ac084a23d987ceb30e56"></script>
</head>
<body>

    <div class="main-container">
        <div id="map"></div>

        <div id="info-panel">
            <h2>🦑 무늬오징어 포인트 정보</h2>
            <p id="coords" class="sub-text">지도를 클릭하여 포인트를 지정하세요.</p>
            
            <div class="card">
                <h3>☀️ 실시간 날씨 & 바람</h3>
                <div class="info-row">
                    <span>날씨 상태</span>
                    <span id="weather-text" class="weather-badge">선택 대기</span>
                </div>
                <div class="info-row">
                    <span>풍속</span>
                    <span><b id="wind-speed" style="font-size:18px; color:#d35400;">-</b> m/s</span>
                </div>
                <div class="info-row">
                    <span>풍향</span>
                    <div>
                        <span id="wind-arrow" class="wind-arrow">↑</span> 
                        <span id="wind-deg" style="font-size:12px; color:#7f8c8d;">(-°)</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>🌊 실시간 조석(물때) 정보</h3>
                <div id="tide-container">
                    <p style="font-size: 13px; color: #95a5a6;">지도를 클릭하면 근처 지역의 물때 정보를 보여줍니다.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tideStations = [
            { name: "제주/서귀포 권역", lat: 33.2400, lng: 126.5617, tides: ["▲ 만조 03:15 (280cm)", "▼ 간조 09:40 (45cm)", "▲ 만조 15:50 (275cm)", "▼ 간조 22:10 (50cm)"] },
            { name: "제주시 권역", lat: 33.5275, lng: 126.5431, tides: ["▲ 만조 03:30 (290cm)", "▼ 간조 09:55 (40cm)", "▲ 만조 16:05 (285cm)", "▼ 간조 22:25 (45cm)"] },
            { name: "부산/경남 권역", lat: 35.1058, lng: 129.0433, tides: ["▲ 만조 04:10 (140cm)", "▼ 간조 10:20 (20cm)", "▲ 만조 16:40 (150cm)", "▼ 간조 23:00 (15cm)"] },
            { name: "통영/남해 권역", lat: 34.8272, lng: 128.4356, tides: ["▲ 만조 04:40 (210cm)", "▼ 간조 11:00 (30cm)", "▲ 만조 17:10 (220cm)", "▼ 간조 23:35 (25cm)"] },
            { name: "완도/전남 권역", lat: 34.3122, lng: 126.7558, tides: ["▲ 만조 05:00 (310cm)", "▼ 간조 11:20 (60cm)", "▲ 만조 17:30 (320cm)", "▼ 간조 23:50 (55cm)"] }
        ];

        document.addEventListener("DOMContentLoaded", function() {
            if (typeof kakao === 'undefined' || !kakao.maps) {
                alert("카카오 지도 SDK 로드 실패!");
                return;
            }

            const mapContainer = document.getElementById('map');
            const mapOption = { 
                center: new kakao.maps.LatLng(33.2483, 126.5641),
                level: 5 
            };

            const map = new kakao.maps.Map(mapContainer, mapOption);
            let marker = null;

            kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                const latlng = mouseEvent.latLng;
                const lat = latlng.getLat();
                const lng = latlng.getLng();

                if (marker) marker.setMap(null);
                marker = new kakao.maps.Marker({ position: latlng });
                marker.setMap(map);

                document.getElementById('coords').innerText = `위도: ${lat.toFixed(4)} / 경도: ${lng.toFixed(4)}`;

                getWeatherData(lat, lng);
                getTideInfo(lat, lng);
            });
        });

        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function getTideInfo(lat, lng) {
            let closest = tideStations[0];
            let minDist = Infinity;

            tideStations.forEach(st => {
                const dist = getDistanceKm(lat, lng, st.lat, st.lng);
                if (dist < minDist) {
                    minDist = dist;
                    closest = st;
                }
            });

            const tideContainer = document.getElementById('tide-container');
            let html = `<p class="obs-name">📍 인근 지역: ${closest.name}</p><ul class="tide-list">`;
            
            closest.tides.forEach(t => {
                const isHigh = t.includes("만조");
                const typeClass = isHigh ? "tide-high" : "tide-low";
                html += `<li class="tide-item"><span class="${typeClass}">${t.split(" ")[0]} ${t.split(" ")[1]}</span><span>${t.split(" ")[2]}</span></li>`;
            });
            html += '</ul>';
            tideContainer.innerHTML = html;
        }

        function getWeatherData(lat, lng) {
            document.getElementById('weather-text').innerText = "조회 중...";
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (!data.current_weather) {
                        document.getElementById('weather-text').innerText = "데이터 없음";
                        return;
                    }

                    const cw = data.current_weather;
                    const windSpeed = (cw.windspeed * 0.277778).toFixed(1);
                    const windDegree = cw.winddirection;
                    
                    document.getElementById('wind-speed').innerText = windSpeed;
                    document.getElementById('wind-deg').innerText = `(${windDegree}°)`;
                    document.getElementById('wind-arrow').style.transform = `rotate(${windDegree}deg)`;
                    
                    document.getElementById('weather-text').innerText = parseWmoCode(cw.weathercode);
                })
                .catch(err => {
                    document.getElementById('weather-text').innerText = "조회 실패";
                });
        }

        function parseWmoCode(code) {
            if (code === 0) return "☀️ 맑음";
            if (code >= 1 && code <= 3) return "⛅ 구름 조금/흐림";
            if (code >= 45 && code <= 48) return "🌫️ 안개";
            if (code >= 51 && code <= 67) return "🌧️ 이슬비/비";
            if (code >= 71 && code <= 77) return "❄️ 눈";
            if (code >= 80 && code <= 82) return "소나기";
            if (code >= 95) return "🌩️ 뇌우";
            return "☀️ 맑음";
        }
    </script>
</body>
</html>
