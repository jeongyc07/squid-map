<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무늬오징어 포인트 맵</title>
    <link rel="shortcut icon" href="#">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; font-family: 'Apple SD Gothic Neo', sans-serif; }
        .main-container { display: flex; width: 100vw; height: 100vh; }
        #map { width: 67%; height: 100%; background-color: #eee; }
        #info-panel { width: 33%; height: 100%; padding: 20px; background: #fff; border-left: 1px solid #ddd; overflow-y: auto; }
        h2 { font-size: 20px; margin-bottom: 5px; }
        .sub-text { color: #777; font-size: 13px; margin-bottom: 15px; }
        .card { background: #f9f9f9; border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            #map { width: 100%; height: 50vh; }
            #info-panel { width: 100%; height: 50vh; }
        }
    </style>

    <!-- 카카오 지도 API (동기 방식 적용) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9f9339f1c455ac084a23d987ceb30e56"></script>
</head>
<body>

    <div class="main-container">
        <div id="map"></div>
        <div id="info-panel">
            <h2>무늬오징어 포인트 정보</h2>
            <p id="coords" class="sub-text">지도를 클릭하여 포인트를 지정하세요.</p>
            
            <div class="card">
                <h3>☀️ 날씨 & 바람</h3>
                <p style="margin-top: 10px;">풍속: <span id="wind-speed">-</span> m/s</p>
                <p>상태: <span id="weather-text">선택 대기</span></p>
            </div>

            <div class="card">
                <h3>🌊 물때 정보</h3>
                <div id="tide-container">지도를 클릭하면 물때 정보를 불러옵니다.</div>
            </div>
        </div>
    </div>

    <script>
        // DOM 생성이 완료된 후 즉시 지도 생성
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof kakao === 'undefined' || !kakao.maps) {
                alert("카카오 지도 API 로드 실패! 카카오 개발자 센터 도메인 등록을 확인해 주세요.");
                return;
            }

            const mapContainer = document.getElementById('map');
            const mapOption = { 
                center: new kakao.maps.LatLng(33.2483, 126.5641), 
                level: 5 
            };

            const map = new kakao.maps.Map(mapContainer, mapOption);
            let marker = null;

            kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                const latlng = mouseEvent.latLng;
                if (marker) marker.setMap(null);
                marker = new kakao.maps.Marker({ position: latlng });
                marker.setMap(map);

                document.getElementById('coords').innerText = `위도: ${latlng.getLat().toFixed(4)} / 경도: ${latlng.getLng().toFixed(4)}`;
            });
        });
    </script>
</body>
</html>
