<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦑 무늬오징어 조과 & 포인트 맵</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Apple SD Gothic Neo', sans-serif; }
        
        .main-container { width: 100vw; height: 100vh; position: relative; }
        #map { width: 100%; height: 100%; }

        /* 우측 조과 기록 패널 (화면의 약 1/3 너비, 기본 숨김) */
        #record-panel {
            position: absolute; right: 0; top: 0; width: 33.333%; height: 100%;
            background: #ffffff; border-left: 1px solid #ddd; box-shadow: -4px 0 15px rgba(0,0,0,0.15);
            z-index: 10; padding: 25px; display: flex; flex-direction: column; gap: 15px;
            transform: translateX(100%); transition: transform 0.3s ease; overflow-y: auto;
        }
        #record-panel.open { transform: translateX(0); }

        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .panel-header h2 { font-size: 18px; color: #2c3e50; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #888; }
        .close-btn:hover { color: #333; }

        .form-group { margin-bottom: 5px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; 
        }
        .form-group textarea { resize: vertical; height: 100px; }

        /* 음력 및 물때 정보 표시 스타일 */
        #lunar-display {
            font-size: 12px; color: #2c3e50; background: #f8f9fa; border: 1px solid #e9ecef; padding: 12px; border-radius: 6px; margin-top: 5px; line-height: 1.6;
        }
        #lunar-display b { color: #2980b9; }

        .save-btn { 
            width: 100%; background: #3498db; color: white; border: none; padding: 12px; 
            border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; 
            margin-top: 5px;
        }
        .save-btn:hover { background: #2980b9; }

        @media (max-width: 768px) {
            #record-panel { width: 100%; }
        }
    </style>

    <!-- 카카오 지도 SDK -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9f9339f1c455ac084a23d987ceb30e56"></script>
</head>
<body>

    <div class="main-container">
        <!-- 지도 영역 -->
        <div id="map"></div>

        <!-- 우측 조과 기록 패널 (1/3 크기) -->
        <div id="record-panel" class="record-panel">
            <div class="panel-header">
                <h2>🦑 무늬오징어 조과 기록</h2>
                <button class="close-btn" onclick="closePanel()">✕</button>
            </div>
            
            <div class="form-group">
                <label>날짜 선택</label>
                <input type="date" id="record-date" onchange="updateTideInfo()">
                <div id="lunar-display">지도를 클릭하여 포인트를 선택하세요.</div>
            </div>

            <div class="form-group">
                <label>조과 및 채비 메모</label>
                <textarea id="record-memo" placeholder="예: 3마리 포획 (대포알 사이즈), 3호 에기 금테, 물때 좋음"></textarea>
            </div>
            <button class="save-btn" onclick="saveRecord()">조과 기록 저장하기</button>
        </div>
    </div>

    <script>
        let map, currentMarker = null;
        let selectedLat = 33.38, selectedLng = 126.55; // 기본 제주 중심

        document.addEventListener("DOMContentLoaded", function() {
            try {
                if (typeof kakao === 'undefined' || !kakao.maps) {
                    alert("카카오 지도 SDK를 불러오지 못했습니다.");
                    return;
                }

                const mapContainer = document.getElementById('map');
                const mapOption = { 
                    center: new kakao.maps.LatLng(selectedLat, selectedLng), 
                    level: 9, 
                    mapTypeId: kakao.maps.MapTypeId.HYBRID 
                };

                map = new kakao.maps.Map(mapContainer, mapOption);

                map.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPLEFT);
                map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

                // 오늘 날짜 세팅
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('record-date').value = today;

                // 지도 클릭 이벤트
                kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                    const latlng = mouseEvent.latLng;
                    selectedLat = latlng.getLat();
                    selectedLng = latlng.getLng();
                    
                    document.getElementById('record-memo').value = '';

                    if (currentMarker) currentMarker.setMap(null);
                    currentMarker = new kakao.maps.Marker({ position: latlng });
                    currentMarker.setMap(map);

                    updateTideInfo();
                    openPanel();
                });
            } catch (error) {
                console.error("초기화 중 오류 발생:", error);
            }
        });

        // 지역별 맞춤 물때 및 만조/간조 계산 함수
        function updateTideInfo() {
            const dateVal = document.getElementById('record-date').value;
            if (!dateVal) return;

            const [year, month, day] = dateVal.split('-').map(Number);
            const targetDate = new Date(year, month - 1, day);
            
            // 기준일: 2026년 1월 1일
            const baseSolar = new Date(2026, 0, 1);
            const diffDays = Math.floor((targetDate - baseSolar) / (1000 * 60 * 60 * 24));
            
            // 음력 계산
            let totalLunarDays = Math.round(diffDays * 0.9843) + 13;
            let lunarYear = 2025, lunarMonth = 11, lunarDay = 13 + totalLunarDays;

            while (lunarDay > 29) {
                let daysInMonth = (lunarMonth % 2 === 0) ? 29 : 30;
                if (lunarDay > daysInMonth) {
                    lunarDay -= daysInMonth;
                    lunarMonth++;
                    if (lunarMonth > 12) { lunarMonth = 1; lunarYear++; }
                } else { break; }
            }
            if (lunarDay <= 0) lunarDay = 1;

            // 물때 이름 (15물 주기)
            const tideNames = ["1물", "2물", "3물", "4물", "5물", "6물", "7물", "8물", "9물", "10물", "11물", "12물", "13물", "무시", "조금"];
            const tideIndex = (lunarDay - 1) % 15;
            let tideStr = tideNames[tideIndex];
            if (tideIndex === 0 || tideIndex === 1) tideStr += " (사리)";
            else if (tideIndex >= 12) tideStr += " (조금)";

            // 💡 클릭한 좌표(위도/경도)에 따른 지역 판별 및 해당 지역 물때 시각 적용
            let regionName = "제주 남부/서귀포";
            let timeOffset = 0; // 분 단위 조시 보정

            if (selectedLng < 126.8 && selectedLat > 33.5) {
                regionName = "제주 북부/제주시";
                timeOffset = 25;
            } else if (selectedLng < 126.3) {
                regionName = "서해안 (목포/신안/완도)";
                timeOffset = 180;
            } else if (selectedLng >= 126.3 && selectedLng < 128.0 && selectedLat < 35.0) {
                regionName = "남해안 서부 (여수/남해)";
                timeOffset = 90;
            } else if (selectedLng >= 128.0 && selectedLng < 128.8) {
                regionName = "남해안 중부 (통영/거제)";
                timeOffset = 60;
            } else if (selectedLng >= 128.8) {
                regionName = "남해안 동부 / 부산";
                timeOffset = 30;
            } else if (selectedLat > 36.5 && selectedLng > 129.0) {
                regionName = "동해안 (포항/울산/강릉)";
                timeOffset = -120;
            }

            // 만조/간조 시간 계산 (기본 기준 시간 + 음력 일수 영향 + 지역별 조시 반영)
            let baseMins = (5 * 60 + (lunarDay * 50) + timeOffset) % 1440;
            if (baseMins < 0) baseMins += 1440;

            const formatTime = (m) => {
                let hour = Math.floor(m / 60) % 24;
                let min = m % 60;
                return `${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
            };

            const high1 = formatTime(baseMins);
            const low1 = formatTime(baseMins + 372);  // 약 6시간 12분 후
            const high2 = formatTime(baseMins + 744); // 약 12시간 24분 후
            const low2 = formatTime(baseMins + 1116); // 약 18시간 36분 후

            // 화면 출력
            document.getElementById('lunar-display').innerHTML = `
                📍 <b>포인트 지역:</b> <span style="color:#e67e22; font-weight:bold;">${regionName}</span><br>
                📅 <b>양력:</b> ${year}년 ${month}월 ${day}일 | 🌙 <b>음력:</b> ${lunarMonth}월 ${lunarDay}일<br>
                🌊 <b>물때:</b> <span style="color:#d35400; font-weight:bold;">${tideStr}</span><br>
                <div style="margin-top:6px; border-top:1px dashed #ccc; padding-top:6px; font-size:11px; color:#555;">
                    📈 <b>만조:</b> ${high1} / ${high2}<br>
                    📉 <b>간조:</b> ${low1} / ${low2}
                </div>
            `;
        }

        function openPanel() {
            document.getElementById('record-panel').classList.add('open');
        }

        function closePanel() {
            document.getElementById('record-panel').classList.remove('open');
            if (currentMarker) {
                currentMarker.setMap(null);
                currentMarker = null;
            }
        }

        function saveRecord() {
            const infoText = document.getElementById('lunar-display').innerText.replace(/\n/g, ' / ');
            const memo = document.getElementById('record-memo').value.trim();

            alert(`[조과 기록 저장 완료]\n${infoText}\n- 메모: ${memo || "없음"}`);
            closePanel();
        }
    </script>
</body>
</html>
