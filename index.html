<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무늬오징어 포인트 맵</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; font-family: 'Apple SD Gothic Neo', sans-serif; background-color: #f4f6f8; }
        
        /* 왼쪽 2/3 지도 */
        #map { width: 67%; height: 100%; }
        
        /* 오른쪽 1/3 정보 창 */
        #info-panel { 
            width: 33%; height: 100%; padding: 20px; 
            background: #ffffff; border-left: 1px solid #e0e0e0; overflow-y: auto;
        }

        h2 { font-size: 20px; color: #1a252f; margin-bottom: 4px; }
        .sub-text { color: #7f8c8d; font-size: 13px; margin-bottom: 15px; }
        
        .card { 
            background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; 
            padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .card h3 { font-size: 15px; color: #2c3e50; margin-bottom: 10px; border-bottom: 2px solid #3498db; padding-bottom: 5px; display: inline-block; }
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 14px; }
        
        /* 풍향 화살표 */
        .wind-arrow { display: inline-block; font-size: 24px; font-weight: bold; color: #e74c3c; transition: transform 0.3s ease; }
        .weather-badge { font-weight: bold; color: #2980b9; }

        .tide-list { list-style: none; margin-top: 8px; }
        .tide-item { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #e0e0e0; }
        .tide-high { color: #e74c3c; font-weight: bold; }
        .tide-low { color: #2980b9; font-weight: bold; }

        /* 모바일 대응 (반응형) */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #map { width: 100%; height: 55vh; }
            #info-panel { width: 100%; height: 45vh; }
        }
    </style>
    <!-- [수정1] 카카오 JavaScript 키 입력 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9f9339f1c455ac084a23d987ceb30e56"></script>
</head>
<body>

    <div id="map"></div>

    <div id="info-panel">
        <h2>무늬오징어 포인트 정보</h2>
        <p id="coords" class="sub-text">지도를 클릭하여 포인트를 지정하세요.</p>
        
        <div class="card">
            <h3>☀️ 날씨 & 바람 (기상청)</h3>
            <div class="info-row">
                <span>날씨</span>
                <span id="weather-text" class="weather-badge">선택 대기</span>
            </div>
            <div class="info-row">
                <span>풍속</span>
                <span><b id="wind-speed" style="font-size:18px; color:#d35400;">-</b> m/s</span>
            </div>
            <div class="info-row">
                <span>풍향</span>
                <div>
                    <span id="wind-arrow" class="wind-arrow">↑</span> 
                    <span id="wind-deg" style="font-size:12px; color:#7f8c8d;">(-°)</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>🌊 만조 / 간조 정보 (해양조사원)</h3>
            <div id="tide-container">
                <p style="font-size: 13px; color: #95a5a6;">지도를 클릭하면 해당 지역 물때를 불러옵니다.</p>
            </div>
        </div>
    </div>

    <script>
        // [수정2] 기상청 인증키 (Encoding)
        const KMA_API_KEY = "88067ec3801cdbebdbaf54ae86c187b740af50cf7b3de5d151ba7832480ac13f";
        
        // [수정3] 국립해양조사원 인증키 (Encoding)
        const KHOA_API_KEY = "88067ec3801cdbebdbaf54ae86c187b740af50cf7b3de5d151ba7832480ac13f";

        const mapContainer = document.getElementById('map');
        const mapOption = { 
            center: new kakao.maps.LatLng(33.2483, 126.5641), // 제주 서귀포 연안 기준
            level: 4 
        };
        const map = new kakao.maps.Map(mapContainer, mapOption);
        let marker = null;

        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
            const latlng = mouseEvent.latLng;
            const lat = latlng.getLat();
            const lng = latlng.getLng();

            if (marker) marker.setMap(null);
            marker = new kakao.maps.Marker({ position: latlng });
            marker.setMap(map);

            document.getElementById('coords').innerText = `위도: ${lat.toFixed(4)} / 경도: ${lng.toFixed(4)}`;

            const grid = dfs_xy_conv("toXY", lat, lng);
            getKmaWeatherData(grid.x, grid.y);
            getTideData(lat, lng);
        });

        // 기상청 날씨/바람 조회
        function getKmaWeatherData(nx, ny) {
            const today = new Date();
            const year = today.getFullYear();
            const month = ('0' + (today.getMonth() + 1)).slice(-2);
            const day = ('0' + today.getDate()).slice(-2);
            const baseDate = `${year}${month}${day}`;

            const url = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst?serviceKey=${KMA_API_KEY}&pageNo=1&numOfRows=100&dataType=JSON&base_date=${baseDate}&base_time=0600&nx=${nx}&ny=${ny}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const items = data.response.body.items.item;
                    let vec = 0, wsd = 0, pty = 0;

                    items.forEach(item => {
                        if (item.category === "WSD") wsd = item.obsrValue;
                        if (item.category === "VEC") vec = item.obsrValue;
                        if (item.category === "PTY") pty = item.obsrValue;
                    });

                    document.getElementById('wind-speed').innerText = wsd;
                    document.getElementById('wind-deg').innerText = `(${vec}°)`;
                    document.getElementById('wind-arrow').style.transform = `rotate(${vec}deg)`;
                    
                    const weatherIcons = { "0": "☀️ 맑음", "1": "🌧️ 비", "2": "🌧️❄️ 비/눈", "3": "❄️ 눈", "5": "🌦️ 빗방울" };
                    document.getElementById('weather-text').innerText = weatherIcons[pty] || "☀️ 맑음";
                })
                .catch(err => {
                    console.error("기상청 API 오류:", err);
                    document.getElementById('weather-text').innerText = "조회 실패";
                });
        }

        // 국립해양조사원 물때 조회 (바다누리 API)
        function getTideData(lat, lng) {
            const today = new Date();
            const year = today.getFullYear();
            const month = ('0' + (today.getMonth() + 1)).slice(-2);
            const day = ('0' + today.getDate()).slice(-2);
            const dateStr = `${year}${month}${day}`;

            const obsCode = "DT_0013"; // 서귀포 관측소 기준 (필요시 변경)
            const url = `https://www.khoa.go.kr/api/oceangrid/tideObsPreTab/search.do?ServiceKey=${KHOA_API_KEY}&ObsCode=${obsCode}&Date=${dateStr}&ResultType=json`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const tideContainer = document.getElementById('tide-container');
                    
                    if (data && data.result && data.result.data) {
                        let html = '<ul class="tide-list">';
                        data.result.data.forEach(item => {
                            const isHigh = item.hl_type.includes("고조") || item.hl_type.includes("만조");
                            const typeClass = isHigh ? "tide-high" : "tide-low";
                            const typeName = isHigh ? "▲ 만조" : "▼ 간조";
                            const timeOnly = item.tide_time ? item.tide_time.split(" ")[1] : "-";

                            html += `
                                <li class="tide-item">
                                    <span class="${typeClass}">${typeName}</span>
                                    <span>${timeOnly}</span>
                                    <span>${item.tide_level} cm</span>
                                </li>
                            `;
                        });
                        html += '</ul>';
                        tideContainer.innerHTML = html;
                    } else {
                        tideContainer.innerHTML = "<p style='font-size:13px; color:#888;'>조석 정보를 찾을 수 없습니다.</p>";
                    }
                })
                .catch(err => {
                    console.error("해양조사원 API 오류:", err);
                    document.getElementById('tide-container').innerHTML = "<p style='font-size:13px; color:#e74c3c;'>물때 정보를 불러오지 못했습니다.</p>";
                });
        }

        // 위경도 -> 기상청 격자(X, Y) 좌표 변환
        function dfs_xy_conv(code, v1, v2) {
            const RE = 6371.00877, GRID = 5.0, SLAT1 = 30.0, SLAT2 = 60.0, OLON = 126.0, OLAT = 38.0, XO = 43, YO = 136;
            const DEGRAD = Math.PI / 180.0;
            const re = RE / GRID, slat1 = SLAT1 * DEGRAD, slat2 = SLAT2 * DEGRAD, olon = OLON * DEGRAD, olat = OLAT * DEGRAD;
            let sn = Math.tan(Math.PI * 0.25 + slat2 * 0.5) / Math.tan(Math.PI * 0.25 + slat1 * 0.5);
            sn = Math.log(Math.cos(slat1) / Math.cos(slat2)) / Math.log(sn);
            let sf = Math.tan(Math.PI * 0.25 + slat1 * 0.5);
            sf = Math.pow(sf, sn) * Math.cos(slat1) / sn;
            let ro = Math.tan(Math.PI * 0.25 + olat * 0.5);
            ro = re * sf / Math.pow(ro, sn);
            const rs = {};
            if (code == "toXY") {
                rs['lat'] = v1; rs['lng'] = v2;
                let ra = Math.tan(Math.PI * 0.25 + (v1) * DEGRAD * 0.5);
                ra = re * sf / Math.pow(ra, sn);
                let theta = v2 * DEGRAD - olon;
                if (theta > Math.PI) theta -= 2.0 * Math.PI;
                if (theta < -Math.PI) theta += 2.0 * Math.PI;
                theta *= sn;
                rs['x'] = Math.floor(ra * Math.sin(theta) + XO + 0.5);
                rs['y'] = Math.floor(ro - ra * Math.cos(theta) + YO + 0.5);
            }
            return rs;
        }
    </script>
</body>
</html>
